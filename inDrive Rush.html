<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>inDrive Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--card:#181818;--ink:#fff;--mute:#a0a0a0;--g:#c1f11d;--line:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef1e8;--card:#fff;--ink:#111;--mute:#666;--line:#ddd}}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 50% -10%,rgba(193,241,29,.12),transparent 55%),var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;overflow:hidden}
#app{width:100%;max-width:430px;padding:8px;display:flex;flex-direction:column;gap:8px;height:100vh;height:100dvh;justify-content:center}
.top{display:flex;justify-content:space-between;align-items:center;flex:none}
.logo{font-weight:900;font-size:26px;letter-spacing:-1px;direction:ltr;display:flex;align-items:center;gap:8px}
.logo span{color:var(--g)}
.logo img{width:36px;height:36px;border-radius:10px;display:block}
.tag{font-size:12px;color:#000;background:var(--g);padding:3px 10px;border-radius:20px;font-weight:800}
.slg{font-size:13px;color:var(--mute);text-align:center;flex:none;margin-top:-2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;overflow-y:auto;max-height:100%;display:flex;flex-direction:column;animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sub{color:var(--mute);font-size:14px;line-height:1.8}
.row{display:flex;gap:10px;margin:10px 0}
.veh{flex:1;border:2px solid var(--line);border-radius:16px;padding:6px;background:#111;color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:.2s}
.veh.on{border-color:var(--g);box-shadow:0 0 18px rgba(193,241,29,.35);transform:translateY(-2px)}
.veh canvas{width:100%;display:block}
.btn{background:var(--g);color:#000;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:900;font-size:18px;width:100%;cursor:pointer;margin-top:8px;flex:none;box-shadow:0 8px 24px rgba(193,241,29,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(193,241,29,.12),0 8px 24px rgba(193,241,29,.35)}}
.tiers{display:flex;gap:8px;margin:10px 0}
.tiers div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:13px}
.tiers b{display:block;color:var(--g);font-size:20px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rules div{background:var(--bg);border-radius:12px;padding:8px;font-size:12.5px;line-height:1.5}
#play{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:5px;font-weight:800;font-size:14px;flex:none}
.hud span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 7px;white-space:nowrap}
.hud em{font-style:normal;color:var(--g)}
#hearts{color:#ff4d5a;letter-spacing:2px}
.mini-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:4px 9px;font-size:14px;cursor:pointer;flex:none;font-family:inherit}
.map{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:14px;flex:none}
.mmap{width:50px;height:50px;position:relative;flex:none}
.mring{position:absolute;inset:0;width:100%;height:100%}
.micon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;line-height:1;pointer-events:none}
.mtxt{flex:1;font-size:13px;color:var(--mute);line-height:1.4}
.mtxt b{color:var(--g);font-size:18px;display:block;margin-top:2px}
.stage{position:relative;width:100%;border-radius:20px;overflow:hidden;display:flex;justify-content:center;background:#000;flex:1;min-height:0}
canvas#c{height:100%;width:auto;max-width:100%;aspect-ratio:360/600;display:block;touch-action:none}
.ctl{direction:ltr;position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10;padding:0 10px}
.ctl button{flex:1;max-width:60px;padding:12px 5px;font-size:20px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(24,24,24,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;cursor:pointer;touch-action:none;font-family:inherit;display:flex;align-items:center;justify-content:center}
.ctl #BRK{max-width:90px;border-radius:20px;font-size:15px;font-weight:900;background:rgba(42,16,19,.75);border-color:rgba(74,26,31,.8);color:#ff8a92}
.ctl #BRK.on{background:#ff2b3d;color:#fff;border-color:#ff2b3d;box-shadow:0 0 20px rgba(255,43,61,.6)}
.ctl #HONK{max-width:50px;background:rgba(58,42,16,.75);border-color:rgba(90,66,24,.8);color:#ffd400}
.ctl #HONK:active{background:#ffd400;color:#000}
.ctl #GAS{max-width:90px;border-radius:20px;font-weight:900;background:rgba(30,56,12,.75);border-color:rgba(100,150,30,.8);color:#c1f11d}
.ctl #GAS.on{background:#c1f11d;color:#000;box-shadow:0 0 20px rgba(193,241,29,.6)}
.ctl #BRK,.ctl #GAS{font-size:13px;padding:12px 2px}
.hudwarn{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#ffd400;border:2px solid #ffd400;border-radius:12px;padding:6px 14px;font-weight:900;font-size:14px;pointer-events:none;animation:blink .45s infinite alternate;white-space:nowrap;z-index:5;min-width:180px;text-align:center}
.hudwarn.bad{color:#ff4d5a;border-color:#ff4d5a}
@keyframes blink{from{opacity:1}to{opacity:.4}}
#chaseBox{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:rgba(40,0,4,.92);color:#ff4d5a;border:2px solid #ff4d5a;border-radius:12px;padding:8px 14px;font-weight:900;font-size:15px;pointer-events:none;z-index:6;min-width:200px;text-align:center;animation:blink .35s infinite alternate}
#chaseBox .cb{height:5px;background:#2a0509;border-radius:3px;margin-top:6px;overflow:hidden}
#chaseBox .cb i{display:block;height:100%;background:#ff4d5a}
#countdown{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:140px;font-weight:900;color:#c1f11d;text-shadow:0 0 40px #c1f11d;z-index:10;pointer-events:none;line-height:1}
#pauseOverlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;z-index:20;padding:24px;text-align:center}
#pauseOverlay .btn{max-width:220px;margin:0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .6s}
.tbm{width:92px;flex:none}.tbl{font-size:12px;color:var(--mute);font-weight:800;margin-bottom:4px;text-align:center}
.tbb{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.tbb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a1f,#ff3d12);transition:width .15s}
.tbm.rdy .tbb{box-shadow:0 0 12px #ff6a1a}.tbm.rdy .tbl{color:#ff9a1f}.tbm.on .tbl{color:#fff}
.ctl #TRB{max-width:56px;background:rgba(60,28,10,.75);border-color:rgba(120,60,20,.8);color:#ff9a1f}
.ctl #TRB.rdy{background:#ff6a1a;color:#fff;border-color:#ff9a1f;animation:pulse .8s infinite}
.ctl #TRB.on{background:#fff;color:#ff3d12;box-shadow:0 0 22px rgba(255,106,26,.9)}
.hide{display:none!important}
.code{cursor:pointer;font-size:26px;letter-spacing:2px;background:var(--g);color:#000;border-radius:14px;padding:10px;text-align:center;font-weight:900;margin:10px 0;direction:ltr}
.big{font-size:52px;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:14px;height:14px;border-radius:50%;background:var(--g)}.dots i.x{background:var(--line)}
h2{text-align:center;margin:4px 0}
/* splash */
#splash{position:fixed;inset:0;z-index:100;direction:ltr;background:radial-gradient(circle at 50% 38%,#25360a 0,#0b0b0b 62%);display:flex;align-items:center;justify-content:center;transition:opacity .6s,transform .6s;overflow:hidden;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sbox{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:2;padding:0 24px;text-align:center}
.slogo{width:124px;height:124px;border-radius:30px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) both,glow 2.2s ease-in-out .9s infinite}
@keyframes pop{from{transform:scale(.25) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(193,241,29,.3)}50%{box-shadow:0 0 60px rgba(193,241,29,.75)}}
.swm{font-size:46px;font-weight:900;color:#fff;letter-spacing:-2px;animation:up .6s .5s both}
.swm span{color:#c1f11d}
.ssl{font-size:18px;font-weight:800;color:#c1f11d;animation:up .6s 1s both;direction:rtl}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sbar{width:170px;height:4px;background:#2a2a2a;border-radius:3px;overflow:hidden;margin-top:10px;animation:up .4s 1.2s both}
.sbar i{display:block;height:100%;background:#c1f11d;animation:fill 1.8s 1.2s linear both}
@keyframes fill{from{width:0}to{width:100%}}
.stap{font-size:12px;color:#777;animation:up .4s 1.6s both}
.sroad{position:absolute;left:0;right:0;bottom:0;height:90px;background:#121212;border-top:3px solid #c1f11d}
.sroad:before{content:"";position:absolute;left:0;right:0;top:44px;height:4px;background:repeating-linear-gradient(90deg,#c1f11d 0 34px,transparent 34px 80px);animation:dash .5s linear infinite}
@keyframes dash{to{background-position:-80px 0}}
.scar{position:absolute;bottom:50px;left:-80px;font-size:44px;animation:drive 2.6s .3s cubic-bezier(.4,0,.6,1) forwards}
@keyframes drive{to{left:110%}}

/* loader */
#loader{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,#25360a 0,#0b0b0b 65%);display:flex;align-items:center;justify-content:center;padding:18px;transition:opacity .35s}
#loader.out{opacity:0;pointer-events:none}
.lbox{width:100%;max-width:430px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.lad{position:relative;width:100%;aspect-ratio:2/1;border-radius:20px;overflow:hidden;background:#111;border:1px solid var(--line);box-shadow:0 10px 40px rgba(193,241,29,.15)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .6s}
.sl.on{opacity:1}
.sl:before{content:"";position:absolute;inset:-20px;background:var(--u) center/cover;filter:blur(18px) brightness(.55)}
.sl:after{content:"";position:absolute;inset:0;background:var(--u) center/contain no-repeat;transform:scale(.97);transition:transform 2.4s ease-out}
.sl.on:after{transform:scale(1)}
.lad{aspect-ratio:2.1/1}
.lbar i{transition:width 2.2s linear}
.ldots{display:flex;gap:6px;margin-top:-6px}.ldots i{width:8px;height:8px;border-radius:50%;background:#333;transition:.3s}.ldots i.on{background:var(--g);width:22px;border-radius:6px}
.lmsg{font-size:22px;font-weight:900;color:#fff;min-height:36px;animation:up .4s both}
.lbar{width:80%;height:8px;background:#2a2a2a;border-radius:6px;overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--g);border-radius:6px;transition:width .3s linear}
.lsub{font-size:13px;color:var(--mute)}
#touchHint{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 16px;font-weight:800;font-size:14px;pointer-events:none;z-index:9;white-space:nowrap;animation:blink .6s infinite alternate}

#langpick{position:fixed;inset:0;z-index:200;direction:ltr;background:radial-gradient(circle at 50% 38%,#25360a 0,#0b0b0b 62%);display:flex;align-items:center;justify-content:center;padding:24px}
.lpbox{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lpbox img{width:100px;height:100px;border-radius:26px;box-shadow:0 0 40px rgba(193,241,29,.5);margin-bottom:6px}
.lpt{font-weight:800;color:#fff;font-size:17px;margin-bottom:6px}
.credit{display:block;text-align:center;font-size:11px;color:var(--mute);margin-top:10px;text-decoration:none;flex:none}
.lb{margin:8px 0;font-size:13px}.lb b{display:block;text-align:center;margin-bottom:4px}
.lb div{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:4px 10px;margin-bottom:3px}
</style>
</head>
<body>
<div id="langpick"><div class="lpbox"><img id="lplogo" alt="inDrive"><div class="lpt">اختار اللغة · Choose your language</div><button class="btn" data-lang="ar">العربية</button><button class="btn" data-lang="en">English</button></div></div>

 var plx=W/2+(laneF-1)*100,bob=Math.sin(el*30)*1.2;

 if(cmt2T>0&&cmt2){c.font="900 15px Cairo, Arial";var w2=c.measureText(cmt2).width+34,bx2=Math.max(8,Math.min(W-8-w2,plx-w2/2)),by2=PY-150;rr(c,bx2,by2,w2,36,10,"rgba(255,255,255,.95)");c.fillStyle="rgba(255,255,255,.95)";c.beginPath();c.moveTo(plx-8,by2+36);c.lineTo(plx,by2+48);c.lineTo(plx+8,by2+36);c.closePath();c.fill();c.fillStyle="#000";c.textAlign="center";c.textBaseline="middle";c.fillText("🪪 "+cmt2,bx2+w2/2,by2+19)}

/* ---------- finish ---------- */
function finish(reason){
 stopAll();phase="finished";
 try{if(document.exitFullscreen&&document.fullscreenElement)document.exitFullscreen().catch(function(){})}catch(e){}
 st=load();$("play").classList.add("hide");var r=$("res");r.classList.remove("hide");
 var lose=(reason==="crash"||reason==="caught"),gain=lose?Math.floor(score*CRASH_KEEP):score;
 if(reason==="arrive"){gain+=50;st.wonToday=true;sWin()}
 gain=Math.max(0,Math.min(gain,CAP-st.dayPts));st.total+=gain;st.dayPts+=gain;
 var isBest=false;if(gain>(st.bestRun||0)){st.bestRun=gain;isBest=true}
 var un=[];TIERS.forEach(function(t){if(st.total>=t[0]&&!st.codes[t[1]]){st.codes[t[1]]="INDRIVE"+t[1]+"-"+Math.random().toString(36).slice(2,6).toUpperCase();un.push(t[1])}});
 save(st);lbAdd(gain);
 var left=MAXT-st.tries,h="";
 var adS=$("loader").querySelectorAll(".sl"),adU=adS.length?adS[(st.tries-1+adS.length)%adS.length].style.getPropertyValue("--u"):"";
 if(adU)h+='<div class="lad" style="--u:'+adU+';margin-bottom:10px"><div class="sl on"></div></div>';
 if(reason==="caught")h+='<div class="big">🚔</div><h2>'+t("caught_t")+'</h2><p class="sub" style="text-align:center">'+t("caught_s")+'</p>';
 else if(reason==="crash")h+='<div class="big">💥</div><h2>'+t("crash_t")+'</h2><p class="sub" style="text-align:center">'+t("crash_s")+'</p>';
 else if(reason==="arrive")h+='<div class="big">🏁🥳</div><h2>'+t("arr_t")+'</h2><p class="sub" style="text-align:center">'+t("arr_s",score)+'</p>';
 else if(reason==="fuel")h+='<div class="big">⛽</div><h2>'+t("fuel_t")+'</h2><p class="sub" style="text-align:center">'+t("fuel_s",score)+'</p>';
 else h+='<div class="big">⏰</div><h2>'+t("time_t")+'</h2><p class="sub" style="text-align:center">'+t("time_s",score)+'</p>';
 if(isBest&&gain>0)h+='<p class="sub" style="text-align:center;color:var(--g)">'+t("newbest")+'</p>';
 if(un.length){sSting();var u=un[un.length-1];h+='<p class="sub" style="text-align:center">'+t("unlock",u)+'</p><div class="code">'+st.codes[u]+'</div><p class="sub" style="text-align:center;font-size:11px">'+t("tap_copy")+'</p>'}
 h+='<div style="margin:10px 0">'+wallet(st)+'</div>';
 var again=left>0&&!st.codes[20]&&!st.wonToday;
 h+='<button class="btn" id="ok">'+(again?t("again"):t("ok"))+'</button>';
 if(!again&&!st.codes[20])h+='<p class="sub" style="text-align:center;margin-top:8px">'+(st.wonToday?t("done_won"):t("done_out"))+'</p>';
 r.innerHTML=h;
 $("ok").onclick=function(){var q=load();if(q.tries<MAXT&&!q.codes[20]&&!q.wonToday)start();else home()}}

$("snd").onclick=function(){snd=!snd;this.textContent=snd?"🔊":"🔇";if(!snd)stopAll();else if(phase==="playing"){startEngine();startBGM()}};
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".code");if(!t||t.dataset.cp)return;var v=t.textContent;
 try{navigator.clipboard.writeText(v)}catch(x){}
 t.dataset.cp=1;t.textContent=I18N[LANG].copied;setTimeout(function(){t.textContent=v;delete t.dataset.cp},1200)});
$("go").onclick=start;
home();
})();
